  crypto: ^3.0.6
  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  collection: ^1.19.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

test:
  paths:
    - test/
